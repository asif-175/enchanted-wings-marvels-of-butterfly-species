<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enchanted Wings</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background: url("{{ url_for('static', filename='images/index_background.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      position: relative;
    }

    /* Transparent clickable button */
    .clickable-area {
      position: absolute;
      left: 340px;  /* Adjusted to match "Get Started" text */
      bottom: 60px; /* Adjusted height from bottom */
      width: 180px; /* Width of the invisible button */
      height: 50px; /* Height of the invisible button */
      cursor: pointer;
      z-index: 10;
    }

    .clickable-area a {
      display: block;
      width: 100%;
      height: 100%;
      text-indent: -9999px; /* Hides text but keeps link active */
    }

    @media screen and (max-width: 768px) {
      .clickable-area {
        left: 25%;
        bottom: 40px;
        width: 160px;
        height: 45px;
      }
    }
  </style>
</head>
<body>
  <!-- Clickable invisible area over the "Get Started" in the image -->
  <div class="clickable-area">
    <a href="{{ url_for('input_page') }}">Get Started</a>
  </div>
</body>
</html>
